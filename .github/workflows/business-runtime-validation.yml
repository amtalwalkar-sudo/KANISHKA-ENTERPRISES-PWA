name: Business runtime validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Install Playwright test dependency
        run: npm install --no-save playwright@1.55.0

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local PWA server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/kfe-server.log 2>&1 &

      - name: Run architecture validation
        run: npm run validate:architecture

      - name: Run business runtime smoke test
        run: |
          cat > kfe-runtime-test.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({permissions: []});
          const errors = [];
          page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
          page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });

          try {
            await page.goto('http://127.0.0.1:4173/', {waitUntil:'networkidle'});
            await page.waitForFunction(() => window.KFE_VIEW_MODELS && window.KFE_DASHBOARD_SNAPSHOT);

            const result = await page.evaluate(() => ({
              models: Object.keys(window.KFE_VIEW_MODELS || {}),
              actions: Object.keys(window.KFE_ACTIONS || {}),
              dashboard: window.KFE_DASHBOARD_SNAPSHOT,
              activeTab: document.querySelector('.tab-panel.active')?.id || null,
              tabButtons: document.querySelectorAll('#tabbar button').length
            }));

            const expectedModels = ['work','fuel','expenses','revenue','maintenance','loan','renewals'];
            for (const name of expectedModels) {
              if (!result.models.includes(name)) throw new Error(`Missing screen view-model: ${name}`);
            }
            if (result.activeTab !== 'tab-work') throw new Error(`Unexpected initial tab: ${result.activeTab}`);
            if (result.tabButtons < 5) throw new Error(`Unexpected tab count: ${result.tabButtons}`);

            for (const tab of ['fuel','expenses','dashboard','backup','work']) {
              await page.locator(`#nav-${tab}`).click();
              await page.waitForTimeout(50);
              const active = await page.locator('.tab-panel.active').getAttribute('id');
              if (active !== `tab-${tab}`) throw new Error(`Tab navigation failed for ${tab}: ${active}`);
            }

            await page.evaluate(() => localStorage.clear());
            await page.locator('#nav-work').click();
            await page.locator('#start-odo').fill('10000');
            await page.evaluate(() => window.KFE_ACTIONS.startWork());
            await page.waitForTimeout(100);
            const stored = await page.evaluate(() => JSON.parse(localStorage.getItem('betafleet_sessions') || '[]'));
            if (stored.length !== 1 || stored[0].startOdo !== 10000 || stored[0].status !== 'Open') {
              throw new Error(`Start-work persistence/business mutation failed: ${JSON.stringify(stored)}`);
            }

            const vmAfterMutation = await page.evaluate(() => window.KFE_VIEW_MODELS.work);
            if (!vmAfterMutation || typeof vmAfterMutation !== 'object') throw new Error('Work view-model unavailable after mutation');
            if (errors.length) throw new Error(errors.join('\n'));

            console.log(JSON.stringify({ok:true, result, stored, vmAfterMutation}, null, 2));
          } finally {
            await browser.close();
          }
          EOF
          node ./kfe-runtime-test.mjs
          rm -f ./kfe-runtime-test.mjs
