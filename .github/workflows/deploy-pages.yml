name: KFE 2.0 Production Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["KFE 2.0 14-item certification"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kfe-production-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy KFE 2.0 production PWA
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve deployment revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            sha="${{ github.sha }}"
          else
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout deployment revision
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.revision.outputs.sha }}
          fetch-depth: 1

      - name: Configure GitHub Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -H 'Accept: application/vnd.github+json' \
            -f build_type='workflow' \
            -f source[branch]='main' \
            -f source[path]='/' || {
              echo 'Pages source could not be changed with GITHUB_TOKEN; continuing to deployment.'
            }

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build production PWA
        env:
          GITHUB_ACTIONS: true
        run: npm run build

      - name: Verify Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/manifest.json
          test -s dist/service-worker.js
          test -s dist/icon-192.png
          test -s dist/icon-512.png
          grep -q '/KANISHKA-ENTERPRISES-PWA/' dist/index.html
          grep -q 'src/main' dist/index.html
          echo "KFE_PAGES_ARTIFACT=PASS"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
