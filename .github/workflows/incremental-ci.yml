name: KFE 2.0 incremental CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      start_boundary:
        description: 'Optional boundary override. Auto is the normal universal mode.'
        required: false
        default: auto
        type: choice
        options: [auto, foundation, governance, architecture, domain, work, administrator, persistence, ui, application, real-persistence, runtime, browser, resilience, final]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kfe-incremental-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify earliest affected boundary
    runs-on: ubuntu-latest
    outputs:
      start: ${{ steps.classify.outputs.start }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Determine boundary
        id: classify
        shell: bash
        env:
          OVERRIDE: ${{ github.event.inputs.start_boundary || 'auto' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$OVERRIDE" != "auto" ]]; then
            echo "start=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "reason=manual override" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          start=final
          reason='unclassified change; conservative final fallback'
          rank(){ case "$1" in foundation)echo 1;; governance)echo 2;; architecture)echo 3;; domain)echo 4;; work)echo 5;; administrator)echo 6;; persistence)echo 7;; ui)echo 8;; application)echo 9;; real-persistence)echo 10;; runtime)echo 11;; browser)echo 12;; resilience)echo 13;; final)echo 14;; esac; }
          set_start(){ if (( $(rank "$1") < $(rank "$start") )); then start="$1"; reason="$2"; fi; }
          for f in "${files[@]}"; do
            case "$f" in
              .github/*|package.json|package-lock.json|vite.config.*|index.html|service-worker.js|src/main.*|js/app.js) set_start foundation 'shared/build/CI infrastructure changed';;
              js/testing/governance-*|js/testing/*governance*) set_start governance 'governance contract changed';;
              js/core/*|js/services/*|js/testing/architecture-*|js/testing/clean-architecture-*) set_start architecture 'shared architecture changed';;
              js/domain/vehicle.*|js/application/administrator.js|js/application/vehicle*|src/components/Vehicle*|src/components/Driver*|js/testing/vehicle-*|js/testing/phase-5-vehicle*|js/testing/phase-6-ui-shell-contract.mjs) set_start administrator 'Vehicle/Driver boundary changed';;
              js/domain/*|js/testing/domain-*|js/testing/*lifecycle*|js/testing/phase-i*|js/testing/phase-j*|js/testing/phase-l*|js/testing/phase-m*|js/testing/phase-n*) set_start domain 'domain/lifecycle changed';;
              js/ui/*|src/components/WorkSessionView.vue|js/testing/*work*|js/testing/*timeline*) set_start work 'Work/timeline boundary changed';;
              js/persistence/*|js/application/*repository*|js/testing/*persistence*|js/testing/phase-k*) set_start persistence 'persistence boundary changed';;
              src/components/*|src/App.vue|src/styles/*|js/testing/phase-1*|js/testing/phase-2*|js/testing/phase-3*|js/testing/phase-5-module*|js/testing/phase-6*) set_start ui 'UI shell/module contract changed';;
              js/application/*|js/testing/*application*) set_start application 'application boundary changed';;
              js/testing/*real-persistence*) set_start real-persistence 'real persistence contract changed';;
              js/testing/phase-4*) set_start runtime 'runtime contract changed';;
              playwright.config.*|js/testing/*browser*|js/testing/work-screen-browser*) set_start browser 'browser integration changed';;
              js/testing/*resilience*|js/testing/*offline*) set_start resilience 'resilience/offline changed';;
              *) set_start final 'unknown path; conservative final fallback';;
            esac
          done
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "INCREMENTAL_START=$start"
          echo "INCREMENTAL_REASON=$reason"
          printf 'CHANGED_FILE=%s\n' "${files[@]}"

  validate:
    name: Validate from ${{ needs.classify.outputs.start }} through final
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium for real-persistence/browser stages
        run: npx playwright install --with-deps chromium
      - name: Build application
        run: GITHUB_ACTIONS=false npm run build
      - name: Execute universal downstream chain
        shell: bash
        env:
          START: ${{ needs.classify.outputs.start }}
          KFE_VALIDATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          KFE_OBSERVED_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          KFE_CI_RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rank(){ case "$1" in foundation)echo 1;; governance)echo 2;; architecture)echo 3;; domain)echo 4;; work)echo 5;; administrator)echo 6;; persistence)echo 7;; ui)echo 8;; application)echo 9;; real-persistence)echo 10;; runtime)echo 11;; browser)echo 12;; resilience)echo 13;; final)echo 14;; esac; }
          start=$(rank "$START")
          run_stage(){ local name="$1"; shift; local n; n=$(rank "$name"); if (( n >= start )); then echo "===== KFE INCREMENTAL: $name ====="; "$@"; fi; }
          foundation(){ npm run validate:kfe-screen-contract; npm run validate:foundation-preflight; }
          governance(){ npm run validate:governance; }
          architecture(){ npm run validate:architecture; npm run validate:foundation; npm run validate:foundation-audit; }
          domain(){ npm run validate:domain; npm run validate:phase-i; npm run validate:phase-j; npm run validate:phase-l; npm run validate:phase-m; npm run validate:phase-n; }
          work(){ npm run validate:work-geolocation; }
          administrator(){ npm run validate:administrator-foundation; npm run validate:vehicle-driver-ui-decoupling; }
          persistence(){ npm run validate:phase-k; }
          ui(){ npm run validate:phase-1; npm run validate:phase-2; npm run validate:phase-3; npm run validate:phase-5; npm run validate:phase-5-replication; npm run validate:phase-5-module-contracts; npm run validate:phase-5-completion-integrity; npm run validate:phase-6-ui-shell; npm run validate:phase-7-reliability; }
          application(){ npm run validate:phase-5-vehicle; npm run validate:phase-5-fuel-application; npm run validate:phase-5-expenses-application; npm run validate:phase-5-revenue-application; npm run validate:phase-5-loans-application; npm run validate:phase-5-renewals-compliance-application; npm run validate:phase-5-maintenance-application; npm run validate:phase-5-profitability-application; npm run validate:phase-5-dashboard-application; }
          real_persistence(){ npm run validate:phase-5-vehicle-real-persistence; npm run validate:phase-5-fuel-real-persistence; npm run validate:phase-5-expenses-real-persistence; npm run validate:phase-5-revenue-real-persistence; npm run validate:phase-5-loans-real-persistence; npm run validate:phase-5-renewals-compliance-real-persistence; npm run validate:phase-5-maintenance-real-persistence; }
          runtime(){ for f in js/app.js js/core/*.js js/domain/*.js js/application/*.js js/services/*.js; do node --check "$f"; done; npm run validate:phase-4; }
          browser(){ nohup npm run dev -- --host 127.0.0.1 --port 4173 >/tmp/kfe-vite.log 2>&1 & sleep 2; for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done; npm run validate:work-screen-browser; }
          resilience(){ node js/testing/app-resilience-reliability-offline.mjs; }
          final(){ GITHUB_ACTIONS=false npm run build; }
          run_stage foundation foundation
          run_stage governance governance
          run_stage architecture architecture
          run_stage domain domain
          run_stage work work
          run_stage administrator administrator
          run_stage persistence persistence
          run_stage ui ui
          run_stage application application
          run_stage real-persistence real_persistence
          run_stage runtime runtime
          run_stage browser browser
          run_stage resilience resilience
          run_stage final final
          echo "KFE_INCREMENTAL_CI=PASS"
          echo "KFE_INCREMENTAL_START=$START"
