name: KFE 2.0 Airtight Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: kfe-airtight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

jobs:
  validate:
    name: KFE 2.0 mandatory validation gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve live repository state before checkout
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" --jq '.head.sha')"
          else
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')"
          fi
          event_sha="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          if [[ -z "$current_sha" || -z "$event_sha" ]]; then
            echo "STATE_MISMATCH: unable to resolve current and event revision"
            exit 1
          fi
          if [[ "$current_sha" != "$event_sha" ]]; then
            echo "STATE_MISMATCH: live=$current_sha event=$event_sha"
            exit 1
          fi
          echo "validated_sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo "KFE_CURRENT_HEAD_SHA=$current_sha" >> "$GITHUB_ENV"
          echo "KFE_EVENT_SHA=$event_sha" >> "$GITHUB_ENV"
          echo "KFE_WORKFLOW_SHA=${{ github.workflow_sha }}" >> "$GITHUB_ENV"

      - name: Checkout exact current revision
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.state.outputs.validated_sha }}
          fetch-depth: 1

      - name: Verify checkout and CI state identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KFE_VALIDATED_SHA: ${{ steps.state.outputs.validated_sha }}
        run: |
          set -euo pipefail
          observed_sha="$(git rev-parse HEAD)"
          if [[ "$observed_sha" != "$KFE_VALIDATED_SHA" ]]; then
            echo "STATE_MISMATCH: checked_out=$observed_sha expected=$KFE_VALIDATED_SHA"
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            live_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" --jq '.head.sha')"
          else
            live_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')"
          fi
          if [[ "$live_sha" != "$observed_sha" ]]; then
            echo "STATE_MISMATCH: live=$live_sha checked_out=$observed_sha"
            exit 1
          fi
          echo "KFE_OBSERVED_CODE_SHA=$observed_sha" >> "$GITHUB_ENV"
          echo "KFE_VALIDATED_SHA=$observed_sha" >> "$GITHUB_ENV"
          echo "KFE_CI_RUN_SHA=$observed_sha" >> "$GITHUB_ENV"
          echo "KFE_STATE_STATUS=FRESH" >> "$GITHUB_ENV"
          echo "KFE state synchronized: $observed_sha"

      - name: Install dependencies
        run: npm install

      - name: Install browser runtime prerequisites
        run: npx playwright install --with-deps chromium

      - name: Specification and architecture gates
        run: |
          npm run validate:architecture
          npm run validate:foundation
          npm run validate:foundation-audit
          npm run validate:repository-hardening

      - name: Domain and financial lifecycle gates
        run: |
          npm run validate:domain
          npm run validate:phase-i
          npm run validate:phase-j
          npm run validate:phase-l
          npm run validate:phase-m
          npm run validate:phase-n

      - name: Persistence and recovery gates
        run: npm run validate:phase-k

      - name: Application boundary and UI contract gates
        run: |
          npm run validate:phase-1
          npm run validate:phase-2
          npm run validate:phase-3
          npm run validate:phase-4
          npm run validate:phase-5
          npm run validate:phase-5-replication
          npm run validate:phase-5-module-contracts
          npm run validate:phase-5-completion-integrity
          npm run validate:phase-6-ui-shell
          npm run validate:phase-7-reliability
          npm run validate:phase-5-vehicle
          npm run validate:phase-5-fuel-application
          npm run validate:phase-5-expenses-application
          npm run validate:phase-5-revenue-application
          npm run validate:phase-5-loans-application
          npm run validate:phase-5-renewals-compliance-application
          npm run validate:phase-5-maintenance-application
          npm run validate:phase-5-profitability-application
          npm run validate:phase-5-dashboard-application

      - name: Real persistence — vehicle
        run: npm run validate:phase-5-vehicle-real-persistence

      - name: Real persistence — fuel
        run: npm run validate:phase-5-fuel-real-persistence

      - name: Real persistence — expenses
        run: npm run validate:phase-5-expenses-real-persistence

      - name: Real persistence — revenue
        run: npm run validate:phase-5-revenue-real-persistence

      - name: Real persistence — loans
        run: npm run validate:phase-5-loans-real-persistence

      - name: Real persistence — renewals/compliance
        run: npm run validate:phase-5-renewals-compliance-real-persistence

      - name: Real persistence — maintenance
        run: npm run validate:phase-5-maintenance-real-persistence

      - name: Real persistence — profitability
        run: npm run validate:phase-5-profitability-real-persistence

      - name: Runtime syntax and Work Screen domain gates
        shell: bash
        run: |
          set -euo pipefail
          for f in js/app.js js/core/*.js js/domain/*.js js/application/*.js js/services/*.js; do node --check "$f"; done
          npm run validate:work-screen-browser

      - name: Financial golden-vector and service-worker gates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { profitability } from './js/domain/dashboard.js';
          const input={revenue:1000000,fuel:100000,maintenanceProvision:50000,fixedOverhead:100000,loanPrincipal:100000,loanInterest:20000,otherBusinessCosts:30000,takeHomeTargetPaise:200000};
          const output=profitability(input);
          if(output.value?.netProfitPaise!==600000) process.exit(1);
          console.log('DIRECT_PROFITABILITY_RESULT='+JSON.stringify(output));
          NODE
          test -f manifest.json
          test -f icon-192.png
          test -f icon-512.png
          test -f service-worker.js
          test -f js/pwa/sw-strategies.js
          grep -q "importScripts('./js/pwa/sw-strategies.js')" service-worker.js
          grep -q "event.request.mode==='navigate'" service-worker.js
          grep -q "kfe-outbox-retry" service-worker.js
          grep -q "navigator.serviceWorker.register" src/main.js

      - name: Production build gate
        run: GITHUB_ACTIONS=false npm run build

      - name: Production artifact integrity gate
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.webmanifest || test -f dist/manifest.json
          test -n "$(find dist -type f | head -n 1)"
          if grep -R "src/main.js" dist/index.html >/dev/null 2>&1; then
            echo "Unbuilt source entrypoint leaked into dist/index.html"
            exit 1
          fi

      - name: Start production artifact
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/kfe-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kfe-preview.log
          exit 1

      - name: Production browser smoke gate
        run: node js/testing/work-screen-browser.mjs

      - name: Offline/resilience gate
        run: node js/testing/app-resilience-reliability-offline.mjs

      - name: Final live-state synchronization gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            live_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" --jq '.head.sha')"
          else
            live_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')"
          fi
          if [[ "$live_sha" != "$KFE_VALIDATED_SHA" ]]; then
            echo "STATE_MISMATCH: repository advanced during validation. validated=$KFE_VALIDATED_SHA live=$live_sha"
            exit 1
          fi
          echo "Final KFE state synchronization PASS: $KFE_VALIDATED_SHA"

      - name: Upload validated production artifact
        uses: actions/upload-artifact@v4
        with:
          name: kfe-production-dist-${{ env.KFE_VALIDATED_SHA }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy validated artifact to GitHub Pages
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download exact validated artifact
        uses: actions/download-artifact@v4
        with:
          name: kfe-production-dist-${{ github.sha }}
          path: dist

      - name: Verify deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -n "$(find dist -type f | head -n 1)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
