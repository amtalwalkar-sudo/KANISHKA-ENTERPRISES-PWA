name: KFE 2.0 14-item certification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kfe-14-cert-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Complete 14-item certification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve live repository state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" --jq '.head.sha')"
            event_sha="${{ github.event.pull_request.head.sha }}"
          else
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            event_sha="${{ github.sha }}"
          fi
          if [[ -z "$current_sha" || -z "$event_sha" ]]; then
            echo "STATE_MISMATCH: unable to resolve current and event revision"
            exit 1
          fi
          if [[ "$current_sha" != "$event_sha" ]]; then
            echo "STATE_MISMATCH: live=$current_sha event=$event_sha"
            exit 1
          fi
          echo "validated_sha=$current_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current revision
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.state.outputs.validated_sha }}
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: GITHUB_ACTIONS=false npm run build
      - name: Install Chromium
        run: timeout 180s npx playwright install --with-deps chromium
      - name: Run 14-item certification suite
        run: npm run validate:e2e
