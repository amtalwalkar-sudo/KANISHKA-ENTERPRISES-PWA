name: Phase 5 completion integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: phase-5-completion-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-5-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Validate Phase 5 completion integrity
        run: npm run validate:phase-5-completion-integrity
