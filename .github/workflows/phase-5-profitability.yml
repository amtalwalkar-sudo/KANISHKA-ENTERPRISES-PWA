name: Phase 5 Basic Profitability validation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: phase-5-basic-profitability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profitability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Install Chromium
        run: timeout 180s npx playwright install --with-deps chromium
      - name: Validate Basic Profitability application boundary
        run: npm run validate:phase-5-profitability-application
      - name: Validate Basic Profitability read-model against real IndexedDB
        run: npm run validate:phase-5-profitability-real-persistence
