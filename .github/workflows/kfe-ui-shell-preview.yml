name: KFE UI Shell Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kfe-ui-shell-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production candidate
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build production candidate
        env:
          KFE_PAGES_BUILD: 'false'
        run: npm run build

      - name: Start built app for certification
        run: npm run preview -- --host 127.0.0.1 > /tmp/kfe-preview.log 2>&1 &

      - name: Wait for built app
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kfe-preview.log
          exit 1

      - name: Run E2E certification before deployment
        run: npm run validate:e2e

      - name: Build verified Pages artifact
        env:
          KFE_PAGES_BUILD: 'true'
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/kfe-preview.log

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified production build
        id: deployment
        uses: actions/deploy-pages@v4
