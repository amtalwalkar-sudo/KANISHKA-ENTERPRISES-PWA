name: Phase 5 Vehicle persistence validation

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: phase-5-vehicle-persistence
  cancel-in-progress: true

jobs:
  vehicle-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Install Chromium
        run: timeout 180s npx playwright install --with-deps chromium
      - name: Validate Vehicle repository contract
        run: npm run validate:phase-5-vehicle
      - name: Validate Vehicle persistence round-trip (real IndexedDB)
        run: npm run validate:phase-5-vehicle-real-persistence
