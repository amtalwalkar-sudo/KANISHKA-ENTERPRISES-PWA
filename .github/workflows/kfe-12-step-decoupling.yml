name: Complete KFE 12-step decoupling
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration once
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          marker='<!-- KFE-12-STEP-UI-SHELL -->'
          if marker in s:
              print('12-step migration already applied')
              raise SystemExit(0)
          matches=list(re.finditer(r'<script>(.*?)</script>',s,re.S))
          if not matches:
              raise SystemExit('No inline runtime script found')
          runtime=matches[-1].group(1).strip()+'\n'
          Path('js/legacy-runtime.js').write_text(runtime)
          start,end=matches[-1].span()
          replacement='''<script src="js/legacy-runtime.js"></script>\n<script type="module" src="js/ui-shell.js"></script>\n<!-- KFE-12-STEP-UI-SHELL -->'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
      - name: Install decoupled shell and verification
        run: |
          cat > js/ui-shell.js <<'EOF'
          import {getScreenViewModel, getDashboardSnapshot} from './app.js';
          const screenNames=['work','fuel','expenses','revenue','maintenance','loan','renewals'];
          function publish(){
            const models=Object.fromEntries(screenNames.map(n=>[n,getScreenViewModel(n)]));
            window.KFE_VIEW_MODELS=Object.freeze(models);
            window.KFE_DASHBOARD_SNAPSHOT=getDashboardSnapshot();
            return models;
          }
          function boot(){
            publish();
            window.dispatchEvent(new CustomEvent('kfe:view-models-ready',{detail:window.KFE_VIEW_MODELS}));
          }
          if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{once:true});
          else boot();
          export {publish};
          EOF
          cat > js/12-step-verify.mjs <<'EOF'
          import fs from 'node:fs';
          const index=fs.readFileSync('index.html','utf8');
          const runtime=fs.readFileSync('js/legacy-runtime.js','utf8');
          const app=fs.readFileSync('js/app.js','utf8');
          const agg=fs.readFileSync('js/dashboard/aggregator.js','utf8');
          const checks=[
            ['UI shell no longer contains the monolithic runtime', !index.includes('async function loadArr')],
            ['legacy runtime externalized', index.includes('js/legacy-runtime.js')],
            ['module shell loaded', index.includes('js/ui-shell.js')],
            ['composition root exists', fs.existsSync('js/app.js')],
            ['all seven screens composed', ['work','fuel','expenses','revenue','maintenance','loan','renewals'].every(x=>app.includes(x))],
            ['dashboard consumes screen view models', agg.includes('getViewModel')],
            ['legacy runtime preserved during extraction', runtime.includes('async function loadArr')]
          ];
          for(const [n,ok] of checks){ console.log(`${ok?'PASS':'FAIL'} ${n}`); if(!ok) process.exitCode=1; }
          EOF
          node js/12-step-verify.mjs
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/legacy-runtime.js js/ui-shell.js js/12-step-verify.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Complete 12-step UI shell decoupling'
          git push
