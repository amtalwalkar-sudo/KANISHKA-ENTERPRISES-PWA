name: KFE 2.0 Publish Production PWA

on:
  workflow_run:
    workflows: [KFE 2.0 single CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: kfe-publish-root-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish production PWA to configured Pages source
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.name == 'KFE 2.0 single CI')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve validated revision
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            validated_sha="${{ github.event.workflow_run.head_sha }}"
            live_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$live_sha" != "$validated_sha" ]]; then
              echo "STATE_MISMATCH: validated=$validated_sha live=$live_sha"
              exit 1
            fi
          else
            validated_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          fi
          echo "validated_sha=$validated_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout validated source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.state.outputs.validated_sha }}
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build production PWA
        env:
          GITHUB_ACTIONS: true
        run: npm run build
      - name: Verify production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/manifest.json
          test -s dist/service-worker.js
          test -s dist/icon-192.png
          test -s dist/icon-512.png
          test -d dist/assets
          grep -q '/KANISHKA-ENTERPRISES-PWA/' dist/index.html
          grep -q '/assets/' dist/index.html
          if grep -q '/src/main.js' dist/index.html; then echo 'ERROR: source entry leaked into production bundle'; exit 1; fi
          echo 'KFE_PRODUCTION_BUNDLE=PASS'
      - name: Publish built runtime into configured Pages source
        shell: bash
        run: |
          set -euo pipefail
          cp dist/index.html ./index.html
          cp dist/manifest.json ./manifest.json
          cp dist/service-worker.js ./service-worker.js
          cp dist/icon-192.png ./icon-192.png
          cp dist/icon-512.png ./icon-512.png
          rm -rf ./assets
          cp -R dist/assets ./assets
      - name: Commit published runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.json service-worker.js icon-192.png icon-512.png assets
          if git diff --cached --quiet; then echo 'No published runtime changes.'; else git commit -m 'build: publish KFE production runtime'; git push; fi
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" -H 'Accept: application/vnd.github+json'
