name: KFE 2.0 Publish Production PWA

on:
  push:
    branches: [main]
    paths-ignore:
      - index.html
      - manifest.json
      - service-worker.js
      - icon-192.png
      - icon-512.png
      - assets/**
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: kfe-publish-root-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build, validate, and publish production PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pushed revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build production PWA
        env:
          GITHUB_ACTIONS: true
        run: npm run build

      - name: Invalidate runtime cache for this deployment
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CACHE_VERSION="kanishka-fleet-kfe2-${DEPLOY_SHA}"
          sed -i "s/^const CACHE_NAME='[^']*';/const CACHE_NAME='${CACHE_VERSION}';/" dist/service-worker.js
          grep -q "const CACHE_NAME='${CACHE_VERSION}';" dist/service-worker.js
          echo "KFE_RUNTIME_CACHE=${CACHE_VERSION}"

      - name: Verify production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/manifest.json
          test -s dist/service-worker.js
          test -s dist/icon-192.png
          test -s dist/icon-512.png
          test -d dist/assets
          grep -q '/KANISHKA-ENTERPRISES-PWA/' dist/index.html
          grep -q '/assets/' dist/index.html
          if grep -q '/src/main.js' dist/index.html; then
            echo 'ERROR: source entry leaked into production bundle'
            exit 1
          fi
          grep -q "const CACHE_NAME='kanishka-fleet-kfe2-${GITHUB_SHA}';" dist/service-worker.js
          echo 'KFE_PRODUCTION_BUNDLE=PASS'

      - name: Publish built runtime into configured Pages source
        shell: bash
        run: |
          set -euo pipefail
          cp dist/index.html ./index.html
          cp dist/manifest.json ./manifest.json
          cp dist/service-worker.js ./service-worker.js
          cp dist/icon-192.png ./icon-192.png
          cp dist/icon-512.png ./icon-512.png
          rm -rf ./assets
          cp -R dist/assets ./assets

      - name: Commit published runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.json service-worker.js icon-192.png icon-512.png assets
          if git diff --cached --quiet; then
            echo 'No published runtime changes.'
          else
            git commit -m 'build: publish KFE production runtime [skip ci]'
            git push origin HEAD:main
          fi

      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" -H 'Accept: application/vnd.github+json'
