name: KFE Development Gate

on:
  push:
    branches:
      - development
      - 'feat/**'
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kfe-development-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout development candidate
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build candidate
        run: npm run build

      - name: Start built app
        run: npm run preview -- --host 127.0.0.1 > /tmp/kfe-preview.log 2>&1 &

      - name: Wait for built app
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kfe-preview.log
          exit 1

      - name: Run E2E certification
        run: npm run validate:e2e

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/kfe-preview.log
