name: Phase 6 UI validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: phase-6-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-6-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate frozen UI shell contract
        run: npm run validate:phase-6-ui-shell
      - name: Build application
        run: npm run build
